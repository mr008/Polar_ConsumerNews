name: collect

# Reads the feed, judges it (Claude), drafts commentary, snapshots the follower
# count (once/day), and runs the reply engine — all into Turso.
# Cadence is 6h (4 runs/day). The earlier 3h bump was justified only by "fresher
# targets for the reply engine" — but that engine is 403-dead (X Feb-2026 policy),
# so the justification is gone. And 3h was NOT read-neutral: the draft step's
# metrics-refresh (scoping.metrics_refresh_top) re-polls live engagement EVERY run
# and is NOT since_id-deduped, so 8 runs/day doubled that spend vs 4. Keep at 6h.
on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (4 runs/day)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[x,llm,turso]"
      - name: collect -> draft -> snapshot -> harvest -> reply -> report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          xbot collect
          xbot draft
          xbot snapshot
          xbot harvest
          xbot reply-scan
          xbot report
          xbot detect
      - name: curator shadow (no-op until CLAUDE_CODE_OAUTH_TOKEN exists)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code
            xbot curate
          else
            echo "curator shadow: token not configured — skipped"
          fi
