# xbot configuration. Tunables live here; SECRETS live in .env.
# See ARCHITECTURE.md for the rationale behind every value.

mode:
  source: api                  # LIVE: reading your real home timeline
  publisher: api               # LIVE: posts go to X
  autonomous: true             # AUTONOMOUS: the publish workflow posts without manual review

scoping:
  # home = full home timeline (server-side since_id dedup, pay only for new posts).
  # list = a curated List (scoping.list_id) — reads ONLY chosen authors without
  # changing who you follow. The List endpoint has no since_id, so the adapter
  # dedups client-side (paginate newest-first, stop at the first seen tweet).
  # Build/refresh the List from yield data with: xbot list-sync
  source_timeline: list       # reads the curated teacher List (xbot list-sync), not the home feed
  list_id: "2072060794150494429"   # private "xbot feed" List; auto-updated weekly
  list_page_size: 25           # List read page size — smaller = less overlap re-pay per run
  # Read ceiling PER COLLECT RUN (4 runs/day). since_id dedup means a run only
  # pays for posts newer than the last one stored, so typical spend per run is
  # "new posts since 6h ago", not the ceiling. ~$0.005/post returned.
  max_posts_per_day: 50
  # CIRCUIT BREAKER: hard cap on paid reads per calendar month (~$20 at 4000).
  # collect refuses to run beyond it and logs why. 0 = disabled.
  # TEMP bump to 5500 (2026-06-26): the 4000 cap froze collection ~06-25 and the
  # account stopped posting. 5500 (~$27.50) carries it through 2026-06-30. REVERT
  # to 4000 once July's budget resets (the new month starts the count at 0).
  monthly_read_budget: 5500
  # Re-poll live engagement for the queue + top candidates each scoring pass
  # (PAID: ~$0.005 each, NOT since_id-deduped, NOT covered by the circuit breaker
  # — so it kept spending while collection was frozen, pushing reads over-cap).
  # OFF (2026-06-26): teaching value (the primary 65% signal) comes from the LLM
  # judge, not engagement, so ranking barely moves; saves ~$3/mo + stops the
  # over-cap creep. Set >0 to re-enable live engagement freshness.
  metrics_refresh_top: 0
  languages: [en]

# AUTO-UPDATING read-List. `xbot list-sync` (weekly cron) keeps the List good on
# its own: a discovery sweep scores accounts you don't yet read, then it PROMOTES
# consistent teachers and DEMOTES members that drift or go quiet. Changes show in
# `xbot report`. Your personal follows are never touched. Metric = AVERAGE teaching
# score (consistency), not a single fluke.
listsync:
  recency_days: 30        # only judge accounts on their last-30-day behavior
  promote_avg: 0.35       # add an account once its avg teaching score clears this
  demote_avg: 0.25        # drop a member whose recent avg falls below this
  min_judged: 3           # need at least this many judged posts before deciding
  flood_judged: 60        # high-volume guard: an account past this many judged posts...
  flood_avg: 0.45         # ...must clear THIS higher avg, or it's a flooder (excluded)
  quiet_days: 21          # drop a member with no new post in this many days
  # Discovery sweep window = DISTINCT accounts to cover (author-fair: <=2 posts
  # kept per author, so one flooder can't hijack the sample). Bigger window =
  # more candidates judged = List grows faster. max_reads is the hard cost ceiling.
  discovery_authors: 50       # distinct accounts to cover per weekly sweep
  discovery_per_author: 2     # cap posts kept per account (flooder guard)
  discovery_max_reads: 250    # hard ceiling on posts READ per sweep (~$1.25/wk cap)

ranking:
  # TEACHING VALUE is primary; engagement is only a secondary sanity-check.
  # quote_score = teaching_weight*teaching + (1-teaching_weight)*engagement, gated by topic.
  teaching_weight: 0.65
  use_llm_judge: true          # the LLM READS each post and scores real teaching value
  judge_model: "claude-haiku-4-5-20251001"   # Haiku — cheap, high-volume classification
  # PRE-DRAFT GATE: a cheap Haiku yes/no ("anything to teach in the TEXT?") BEFORE
  # the Sonnet commentary call. Built + tested, but DISABLED: calibration against
  # the 27 published posts showed the generator's accept/reject boundary is too
  # fuzzy for a cheap binary filter — at zero post loss it cuts only ~11% of waste
  # (~$0.4/mo net), and any stricter setting drops real posts. Flip true only if
  # you accept some post loss for more saving. FAIL-OPEN: error/ambiguity drafts it.
  draft_prescreen: false
  prescreen_model: "claude-haiku-4-5-20251001"   # defaults to judge_model if unset
  # QA GATE: a Haiku editor pass on every draft — rejects meta-commentary
  # ("drop the full thread..."), no-lesson drafts, broken format. One revision
  # attempt before a draft is blocked. Fail-open if the LLM is unavailable.
  qa_gate: true
  judge_examples:              # the owner's own calls — few-shot the judge to YOUR taste
    - text: "save this for when you overthink your marketing — millions of views from reusing the same AI image. the opportunity is right there."
      verdict: good
      why: "real distribution insight (content reuse) under casual framing — reward it"

scoring_weights:               # ENGAGEMENT composite (the secondary signal).
  # Favors under-distributed gems (eng/follower) and multiple trusted shares (echo)
  # over raw vanity metrics (likes, velocity) — high reach != good teaching.
  likes: 0.05
  reposts: 0.15
  velocity: 0.10
  eng_per_follower: 0.25
  echo: 0.25
  recency: 0.10
  topic_fit: 0.10

thresholds:
  # 0.45 works because the judge now emits a GRADED topic_fit (0.0-1.0) instead
  # of a hard true/false — adjacent-but-useful content (general marketing,
  # creator economy, AI tooling) lands ~0.5 and clears the bar.
  topic_fit_min: 0.45
  quote_worthy_min: 0.35       # looser floor — keeps resonant posts (e.g. adriamatz)
  near_dup_similarity: 0.82
recency_tau_hours: 8

topics:
  focus: viral_consumer_app_content
  include:
    - ai ugc
    - content marketing
    - viral content
    - app growth
    - distribution
    - consumer apps
    - product
    - startups
  keywords:                    # cheap offline topic-fit signal (real version uses embeddings/LLM)
    - ugc
    - viral
    - views
    - content
    - marketing
    - growth
    - app
    - product
    - startup
    - founder
    - launch
    - distribution
    - hook
    - algorithm
    - retention
    - acquisition

posting:
  per_day: 3                   # hard daily cap (publish_due re-checks posted_log)
  per_run: 1                   # each scheduled window posts at most one draft
  # Draft queue = small standby buffer, NOT a backlog: collect tops it up to
  # per_day+1 pending drafts (one spare in case a publish fails), and anything
  # older than draft_max_age_hours expires so commentary never goes stale.
  draft_max_age_hours: 48
  # Research-backed windows (Buffer 8.7M-post study, Sprout Social, 2026): weekday
  # late-morning→afternoon in the audience's local time wins; audience spans ET→PT.
  # The publish workflow's cron fires at each window start + sleeps 0-90 random
  # minutes, so the actual post time differs every day.
  windows: ["08:00-09:30", "12:00-13:30", "16:30-18:00"]
  timezone: "America/Los_Angeles"
  jitter_minutes: 90           # documented here; enforced in .github/workflows/publish.yml
  min_gap_minutes: 90
  author_cooldown_days: 5
  # When the queue is full but a new candidate beats the weakest pending draft
  # by this quote_score margin, the weak draft is retired and replaced.
  supersede_margin: 0.15
  # FORMAT (2026-06): X's algorithm gives near-zero distribution to posts
  # containing URLs (non-Premium), and a URL bumps the write to ~$0.20 (vs
  # $0.015). So the MAIN POST never carries a URL anymore:
  #   mention — commentary + "h/t @handle" tail; source link hidden in a
  #             self-reply below (attribution_reply). THE default.
  #   link    — legacy: URL appended to the main post (buried + $0.20). Rollback only.
  # (Cross-account quote_tweet_id is still broken on X, ~Feb 2026.)
  format: mention
  # ADAPTIVE THREADS: when the judge's teaching score clears thread_min_teaching
  # AND the source carries 3+ concrete steps, the draft becomes a short tutorial
  # thread (hook + step replies). Otherwise a single compact post.
  adaptive_threads: true
  thread_min_teaching: 0.75
  max_thread_parts: 3          # hook + up to 2 step replies (attribution excluded)
  max_part_chars: 270
  # The hidden source link: a final self-reply "source: <url>". ⚠ $0.20 per
  # published item (~$18/mo at 3/day) — the single biggest cost line. Flip to
  # false to save all of it (the h/t mention still credits the author).
  # OFF (2026-06-15, owner call): the dangling "source:" self-reply cluttered the
  # profile timeline. The h/t @handle tail still credits the author.
  attribution_reply: false

safety:
  exclude: [politics, ragebait, nsfw, harassment, personal_drama, medical_advice, legal_advice, investment_advice]
  # app-revenue / "$X-mo" growth stories are IN-SCOPE marketing content (NOT financial advice).
  require_public_author: true
  toxicity_max: 0.3

voice:
  style: growth_first          # punchy operator energy; NOT measured-curator
  angle: skill_sharing         # teach the tactic: why it works / the move to steal
  format: compact_breakdown    # single post: hook + 2-4 bullets + takeaway
  allow_thread_for_top_posts: false
  tone: straight               # report author's claims neutrally; no hedge, no vouching
  protagonist: me              # post is about ME (the teacher), author de-emphasized
  author_emphasis: low
  credit_style: subtle_tail    # small "h/t @handle" tail only (embed shows the source)
  hype_ok: true
  include_source_link: false   # quote embed carries source; a URL triggers the $0.20 write tier
  fabrication: forbidden
  anchors:
    - https://x.com/adriamatz/status/2062619382631497931
    - https://x.com/ErnestoSOFTWARE/status/2062621170042917373

llm:
  provider: anthropic                   # anthropic | groq | xai | gemini | openai | auto
  commentary_model: "claude-sonnet-4-6"            # Sonnet — the public voice
  classifier_model: "claude-haiku-4-5-20251001"    # (legacy field; judge_model below is used)
  embeddings_model: "text-embedding-3-small"
  # Target the prompt asks for — deliberately under the real ~250 budget so the
  # model has headroom (too_long was 50% of all draft blocks at 230).
  max_commentary_chars: 200
  temperature: 0.7

# AUTO-REPLY ENGINE — the follower-growth lever. Replies to fresh, on-topic
# posts from bigger accounts in the (followed) home feed. Runs at the end of
# each collect workflow; zero extra API reads. Conservative caps on purpose:
# automated replies are the highest-ToS-risk surface in the bot.
replies:
  # DISABLED 2026-06-15: X's "Operation Kill the bots" policy (effective
  # 2026-02-23) makes POST /2/tweets reject ALL programmatic replies on
  # Free/Basic/Pro/Pay-Per-Use plans unless the target's author has @mentioned
  # or quoted us first. Confirmed live: even reply_settings="everyone" posts
  # 403 with "...not allowed because you have not been mentioned or otherwise
  # engaged by the author...". No code fix revives this; only manual replies or
  # Enterprise tier work. Main posts/quote-tweets are unaffected. Don't re-enable
  # on follower growth — account size is not the cause.
  #
  # LIVE PATH instead: `xbot reply-queue [--fresh]` — the human-in-the-loop
  # machine. The bot selects targets + drafts replies (reusing the keys below:
  # min_*, max_target_age_minutes, max_reply_chars, model); YOU post them
  # manually within the velocity window. Drafting is deferred to the session, so
  # tokens are spent only on drafts you actually review (~$0.003 each, Sonnet).
  enabled: false
  dry_run: false               # LIVE (owner call, 2026-06-12) — flip true to pause posting
  max_per_day: 3               # ramp plan: 3 (week 1) -> 6 after quality review
  max_per_run: 1
  min_minutes_between: 45
  author_cooldown_days: 3
  # Lowered 5000 -> 1000 (2026-06-15): most >5K accounts restrict who can reply,
  # so they were un-repliable from this account. The reply_settings filter (only
  # 'everyone'-repliable posts are targeted) is the real guard now; this floor
  # just keeps targets reasonably sized.
  min_author_followers: 1000
  max_target_age_minutes: 360  # 6h: matches the collect cadence; also the manual
                               # reply-queue's only age gate (autonomous engine is
                               # off), so it must span at least one collect interval
                               # or the bank is always "too old" between runs.
  min_topic_fit: 0.45
  min_teaching: 0.2            # lighter than the QT bar — we're adding value, not curating
  max_reply_chars: 240
  model: "claude-sonnet-4-6"   # the public voice — same as commentary
  exclude_authors: []

growth:
  snapshot_enabled: true       # daily follower-count snapshot (~$0.001/day)

ops:
  db_path: "data/state.db"
  collector_interval_minutes: 60
  watchlist_repoll_hours: [1, 3, 6]
  kill_switch_file: "data/STOP"
  report_webhook_env: "REPORT_WEBHOOK"
